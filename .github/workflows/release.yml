# Release udt_curses on a version tag: publish the source package and the
# per-arch UniData binary (the ncurses CallC bridge, curscb.c -> curscb.o) as
# GitHub release assets.  The package registry indexes them via its release
# webhook (it hosts nothing).  Asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_'):
#   source                      -> mvx-lang_curses-<ver>-source.tar.gz
#   udt binary (linux/x86_64,le)-> mvx-lang_curses-<ver>-udt-linux-x86_64-le.tar.gz
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# udt_curses is UniData-only (ncurses via CallC), so there is no mvx binary.
# Tag the bare version to release, e.g.:  git tag 0.1 && git push origin 0.1
# The binary builds in the udt-builder container (ncurses-devel + gcc) on the
# self-hosted RedHat/Rocky runner (label `udt`).
name: release

on:
  push:
    tags:
      # ONE rolling dev tag per release line, moved to the HEAD of develop by
      # the nightly when there is something new.  It builds through THIS
      # workflow rather than a second copy of it, so a dev build is the same
      # artifacts by the same steps as a release -- the only way a dev build is
      # worth having.
      #
      # `<maj>.<min>.x-dev' MATCHES THE PATTERN ABOVE, so the dev tag needs no
      # entry of its own any more.  It used to: the tag was a bare `dev', which
      # both version readers took for a stable 0.0.0 (mvx#364).  The entry is
      # gone rather than kept harmlessly, because a trigger for a shape we have
      # just retired is how the shape comes back.
      - "[0-9]+.[0-9]+*"

  # A TAG PUSHED BY A WORKFLOW DOES NOT TRIGGER ONE.  GitHub will not let the
  # default GITHUB_TOKEN start another run -- it is how recursion is prevented
  # -- so the nightly's tag lands and nothing happens.  It dispatches this
  # workflow on the tag instead, which is the same build from the same ref.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ci.yml runs this on every push and pull request, but not on a TAG -- and a
  # tag is the one push where shipping manifests that disagree is permanent.
  # curl, json, mapfield and curl-cmd each gate their release the same way (#6).
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The manifests agree with each other
        run: |
          set -eu
          want=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                   mvpkg.json | head -1)
          [ -n "$want" ] || { echo "::error::mvpkg.json has no version"; exit 1; }
          sh tests/manifest-version.sh "$want"

  # ---- source package: BASIC + the CallC bridge source (builds on install) ---
  source:
    needs: [manifests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # IN-TREE, BOTH MANIFESTS SAY 0.0.0-dev (#4).  Deliberately -- a number
      # committed there can only be stale or coincidentally right, and nothing
      # reads it: publish-source stamps the tag into the manifests it ships,
      # and so does the registry's udt-build.  Do not bump it before a release;
      # tag, and the tag lands in the artifact.
      - uses: mvx-lang/mvx/.github/actions/publish-source@main
        with:
          package: mvx-lang/curses
          title: udt-curses
          body: "udt_curses — ncurses terminal handling for UniData. Source + prebuilt udt binary; indexed by the package registry."

  # ---- udt binary: the compiled ncurses CallC bridge -------------------------
  # Builds in the licensed udt-builder container on the self-hosted `udt` runner.
  # The shared udt-build action does the scaffolding (image check, artifact key,
  # container run, tar, publish); build-udt.sh stages this package's release.
  # needs: [source] -- for TWO reasons, neither of them ordering for its own
  # sake.  First, a gate that only one publishing job waits for is not a gate:
  # without this, udt-binary would upload a binary built from manifests the
  # `manifests` job had just rejected.  Second, both publishing jobs CREATE the
  # release as a side effect of uploading to it, so jobs starting together each
  # try to create it -- one wins and the loser fails with
  # `Validation Failed: {"code":"already_exists","field":"tag_name"}`, leaving a
  # stray draft beside the tag.  On mv_package#66 the job it killed was the one
  # others needed, and the release shipped with half its artifacts.  `source`
  # alone creates it; the rest upload into it.  curl's release.yml carries the
  # same edge for the same reason.
  udt-binary:
    needs: [source]
    runs-on: [self-hosted, linux, udt]
    steps:
      - uses: actions/checkout@v5
      - uses: mvx-lang/mv-package-registry/.github/actions/udt-build@main
        with:
          package: mvx-lang/curses

  # ---- what kind of release is this? ----------------------------------------
  # LAST, because it is correcting the publish steps rather than joining them.
  # Both of them create the release as a side effect of uploading to it, and
  # neither is told what the release is: publish-source marks a pre-release with
  # `contains(ref_name, '-')`, which is FALSE for `dev`; udt-build hands
  # softprops only a tag_name, and its defaults are `prerelease: false` and
  # latest.  So whichever finishes last decides, and left alone a nightly dev
  # build would present itself as the newest stable one -- to the registry, and
  # to anyone installing this package by name.
  #
  # Both directions are set explicitly, for the same reason: leaving the stable
  # case alone means it keeps whatever that race happened to leave behind.
  mark:
    needs: [source, udt-binary]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # STABLE IS THE ONE THAT IS NOT A PRE-RELEASE.  dev, beta and rc all
          # are; a stable tag is anything with no suffix -- 2.1.0, not
          # 2.1.0-rc1 and not dev.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac

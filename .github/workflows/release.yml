# Release udt_curses on a version tag: publish the source package and the
# per-arch UniData binary (the ncurses CallC bridge, curscb.c -> curscb.o) as
# GitHub release assets.  The package registry indexes them via its release
# webhook (it hosts nothing).  Asset names mirror the registry's artifact key
# (<name>-<ver>-<suffix>, base = package name '/'->'_'):
#   source                      -> mv-lang_curses-<ver>-source.tar.gz
#   udt binary (linux/x86_64,le)-> mv-lang_curses-<ver>-udt-linux-x86_64-le.tar.gz
# Copyright (C) 2026 Gordon Heydon.  GPL-2.0-only.
#
# udt_curses is UniData-only (ncurses via CallC), so there is no mvx binary.
# Tag the bare version to release, e.g.:  git tag 0.1 && git push origin 0.1
# The binary builds in the udt-builder container (ncurses-devel + gcc) on the
# self-hosted RedHat/Rocky runner (label `udt`).
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  # ---- source package: BASIC + the CallC bridge source (builds on install) ---
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the source
        id: pkg
        shell: bash
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME}"
          BASE="mv-lang_curses-$VER-source"
          tar czf "/tmp/$BASE.tar.gz" --exclude='./.git' --exclude='./.github' .
          mv "/tmp/$BASE.tar.gz" .
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the source asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: udt-curses ${{ github.ref_name }}
          body: "udt_curses — ncurses terminal handling for UniData. Source + prebuilt udt binary; indexed by the package registry."
          files: |
            ${{ steps.pkg.outputs.tarball }}
            ${{ steps.pkg.outputs.checksum }}
          fail_on_unmatched_files: true

  # ---- udt binary: the compiled ncurses CallC bridge -------------------------
  udt-binary:
    runs-on: [self-hosted, linux, udt]
    steps:
      - name: Check out udt_curses
        uses: actions/checkout@v4

      - name: Build the ncurses CallC bridge in the udt-builder container
        id: build
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${UDT_BUILDER_IMAGE:-udt-builder:8.3.2}"
          if ! docker image inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::udt-builder image '$IMAGE' not on this runner." >&2; exit 1
          fi
          VER="${GITHUB_REF_NAME}"
          ARCH="$(uname -m)"; OS="$(uname -s | tr 'A-Z' 'a-z')"; case "$OS" in *linux*) OS=linux ;; esac
          case "$(printf '\1\2' | od -An -tx2 | tr -d ' \n')" in
            0201*) ENDIAN=le ;; 0102*) ENDIAN=be ;; *) ENDIAN=le ;;
          esac
          # Native code -> os+arch-locked binary; name mirrors the registry key
          # (base = package name with '/'->'_') so the release webhook maps it.
          BASE="mv-lang_curses-$VER-udt-$OS-$ARCH-$ENDIAN"
          # Compile udt-callc/*.c -> .o in a staged copy and drop the .c (the
          # client links the object without a compiler), then tar the package.
          docker run --rm -e BASE="$BASE" -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -v "$PWD":/src -w /src "$IMAGE" bash -lc '
              set -e
              rm -rf /tmp/stage && mkdir -p /tmp/stage
              cp -a . /tmp/stage/ && rm -rf /tmp/stage/.git /tmp/stage/.github
              for c in /tmp/stage/udt-callc/*.c; do gcc -m64 -fPIC -O2 -c "$c" -o "${c%.c}.o"; rm -f "$c"; done
              tar czf "/src/$BASE.tar.gz" -C /tmp/stage .
              chown "$HOST_UID:$HOST_GID" "/src/$BASE.tar.gz"
            '
          test -f "$BASE.tar.gz"
          sha256sum "$BASE.tar.gz" > "$BASE.tar.gz.sha256"
          echo "tarball=$BASE.tar.gz" >> "$GITHUB_OUTPUT"
          echo "checksum=$BASE.tar.gz.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish the udt binary asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            ${{ steps.build.outputs.tarball }}
            ${{ steps.build.outputs.checksum }}
          fail_on_unmatched_files: true
